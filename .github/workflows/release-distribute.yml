# Mirrors a stable release to the package channels (S-103a). Reusable: called
# by the last job of packages.yml, and runnable by hand for a rerun. A
# workflow triggered by `release: published` would not fire for a release
# created with the job token, so that trigger is not used.
#
# Each channel is scripts/channels/NAME.sh (see scripts/channels/run-all.sh for
# the contract). Secrets are ENVIRONMENT secrets of NAME-publishing, passed as
# whole env values; never define them at repository level, or every channel
# job could read them. Each NAME-publishing environment must restrict
# deployment to v* tags (docs/distribution-channels/README.md). Variable names
# here must match what scripts/channels/NAME.sh reads;
# tests/release/s103a_env_drift.sh fails on any drift. Nothing here pushes to main.
name: release-distribute

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, vX.Y.Z
        required: true
        type: string
      dry_run:
        description: Print what each channel would do, change nothing outside
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, vX.Y.Z
        required: true
        type: string
      dry_run:
        description: Print what each channel would do, change nothing outside
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  channel:
    if: vars.CANONICAL_REPO == github.repository
    runs-on: ubuntu-24.04
    environment: ${{ matrix.channel }}-publishing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: [winget, scoop, copr, aur, apt]
    steps:
      # The tag is checked before anything uses it as a ref or a path.
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu +x
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "not a release tag"
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # Tools are installed only for the channel that needs them, pinned.
      - name: Install Komac (winget)
        if: matrix.channel == 'winget'
        env:
          KOMAC_VERSION: "2.17.1"
          KOMAC_SHA256: e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7
        run: |
          set -eu
          f="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/$f"
          echo "${KOMAC_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/bin" komac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install copr tools (copr)
        if: matrix.channel == 'copr'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm rpmlint
          python3 -m venv "$RUNNER_TEMP/copr-venv"
          "$RUNNER_TEMP/copr-venv/bin/pip" install --require-hashes --no-deps -r packaging/release/copr-cli-requirements.txt
          echo "$RUNNER_TEMP/copr-venv/bin" >> "$GITHUB_PATH"
      # The APT signing key is in the step env of the apt step ONLY. apt.sh
      # syncs, signs and uploads in one process (AC-f2 amended in S-103), so
      # that step also holds the object storage credentials; the key lives in
      # the apt-publishing environment, limited to v* tags.
      - name: Run the channel
        if: matrix.channel != 'apt'
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANNEL: ${{ matrix.channel }}
          CANONICAL_REPO: ${{ vars.CANONICAL_REPO }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET_REPO: ${{ vars.BUCKET_REPO }}
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -eu +x
          flags=()
          [ "$DRY_RUN" != true ] || flags+=(--dry-run)
          rc=0
          scripts/channels/run-all.sh "$TAG" --only "$CHANNEL" --results-dir "$RUNNER_TEMP/results" ${flags[@]+"${flags[@]}"} || rc=$?
          exit "$rc"
      - name: Run the apt channel (signing key)
        if: matrix.channel == 'apt'
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANNEL: ${{ matrix.channel }}
          CANONICAL_REPO: ${{ vars.CANONICAL_REPO }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_R2_ACCESS_KEY_ID: ${{ secrets.APT_R2_ACCESS_KEY_ID }}
          APT_R2_SECRET_ACCESS_KEY: ${{ secrets.APT_R2_SECRET_ACCESS_KEY }}
          APT_R2_ACCOUNT_ID: ${{ secrets.APT_R2_ACCOUNT_ID }}
          APT_R2_BUCKET: ${{ vars.APT_R2_BUCKET }}
        run: |
          set -eu +x
          flags=()
          [ "$DRY_RUN" != true ] || flags+=(--dry-run)
          rc=0
          scripts/channels/run-all.sh "$TAG" --only "$CHANNEL" --results-dir "$RUNNER_TEMP/results" ${flags[@]+"${flags[@]}"} || rc=$?
          exit "$rc"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: result-${{ matrix.channel }}
          path: ${{ runner.temp }}/results/*.result
          if-no-files-found: ignore

  status:
    needs: channel
    if: always() && vars.CANONICAL_REPO == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - name: Channel status table
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          scripts/channels/run-all.sh "$TAG" --render-only --results-dir results | tee -a "$GITHUB_STEP_SUMMARY"
