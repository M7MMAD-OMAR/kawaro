name: Packages
# Builds the RPM and DEB, installs each in clean containers, and attaches
# them to the GitHub release when a v* tag is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The oldest supported glibc: binaries built here run on newer systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: packaging/linux/build-packages.sh target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:41
            install: dnf install -y --setopt=install_weak_deps=False /dist/*.rpm
          - image: fedora:latest
            install: dnf install -y --setopt=install_weak_deps=False /dist/*.rpm
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
          - image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: /dist
      - run: ${{ matrix.install }}
      - name: Smoke test
        run: |
          sbarhive --version
          base64 -d > /tmp/a.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAE0lEQVR4nGP4z8DA8B+MGP4zAAAd8AP9pokTAAAAAABJRU5ErkJggg==
          PNG
          sbarhive convert --to webp /tmp/a.png
          test "$(head -c 4 /tmp/a.webp)" = RIFF
          test -f /usr/share/kio/servicemenus/sbarhive.desktop
          test -f /usr/lib/systemd/user/sbarhive.service

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber -R "${GITHUB_REPOSITORY}"

  # Signed update feed (S-053c, ADR 0006). The only job that sees the signing
  # secrets; they are whole env values here and nowhere else.
  update-manifest:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'M7MMAD-OMAR/sbarhive'
    runs-on: ubuntu-22.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign jq
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p feed
          version="${GITHUB_REF_NAME#v}"
          gh release view "${GITHUB_REF_NAME}" --json assets -R "${GITHUB_REPOSITORY}" > assets.json
          scripts/make-update-manifest.sh --dist dist beta "${version}" assets.json feed/beta.json
          case "${version}" in
            *-*) ;;
            *) scripts/make-update-manifest.sh --dist dist stable "${version}" assets.json feed/stable.json ;;
          esac
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$UPDATE_SIGNING_KEY" > "${RUNNER_TEMP}/update.key"
          for f in feed/*.json; do
            scripts/sign-update-manifest.sh "${RUNNER_TEMP}/update.key" "$f"
          done
          rm -f "${RUNNER_TEMP}/update.key"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updates -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create updates --prerelease --latest=false \
              --title "Update feed" --notes "Signed update manifests (ADR 0006)." \
              -R "${GITHUB_REPOSITORY}"
          fi
          case "${GITHUB_REF_NAME}" in
            *-*) files=(feed/beta.json feed/beta.json.minisig) ;;
            *) files=(feed/stable.json feed/stable.json.minisig feed/beta.json feed/beta.json.minisig) ;;
          esac
          gh release upload updates "${files[@]}" --clobber -R "${GITHUB_REPOSITORY}"
