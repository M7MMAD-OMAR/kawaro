name: Packages
# Builds the RPM and DEB, installs each in clean containers, and attaches
# them to the GitHub release when a v* tag is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The oldest supported glibc: binaries built here run on newer systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: packaging/linux/build-packages.sh target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:41
            install: dnf install -y --setopt=install_weak_deps=False /dist/*.rpm
          - image: fedora:latest
            install: dnf install -y --setopt=install_weak_deps=False /dist/*.rpm
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
          - image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: /dist
      - run: ${{ matrix.install }}
      - name: Smoke test
        run: |
          sbarhive --version
          base64 -d > /tmp/a.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAE0lEQVR4nGP4z8DA8B+MGP4zAAAd8AP9pokTAAAAAABJRU5ErkJggg==
          PNG
          sbarhive convert --to webp /tmp/a.png
          test "$(head -c 4 /tmp/a.webp)" = RIFF
          test -f /usr/share/kio/servicemenus/sbarhive.desktop
          test -f /usr/lib/systemd/user/sbarhive.service

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber -R "${GITHUB_REPOSITORY}"
