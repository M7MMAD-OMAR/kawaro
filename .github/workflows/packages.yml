name: Packages
# Builds the RPM and DEB and the Windows zip and MSI, installs the Linux
# packages in clean containers, and publishes everything to the GitHub release
# when a v* tag is pushed (S-055). A tag with a hyphen (v0.4.0-beta.1) is a
# prerelease. Only the release and update-manifest jobs may write.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The oldest supported glibc: binaries built here run on newer systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: packaging/linux/build-packages.sh target/release dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:41
            install: dnf install -y --setopt=install_weak_deps=False /dist/*.rpm
          - image: fedora:latest
            install: dnf install -y --setopt=install_weak_deps=False /dist/*.rpm
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
          - image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends /dist/*.deb
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: /dist
      - run: ${{ matrix.install }}
      - name: Smoke test
        run: |
          kawaro --version
          base64 -d > /tmp/a.png <<'PNG'
          iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAIAAAD91JpzAAAAE0lEQVR4nGP4z8DA8B+MGP4zAAAd8AP9pokTAAAAAABJRU5ErkJggg==
          PNG
          kawaro convert --to webp /tmp/a.png
          test "$(head -c 4 /tmp/a.webp)" = RIFF
          test -f /usr/share/kio/servicemenus/kawaro.desktop
          test -f /usr/lib/systemd/user/kawaro.service

  # Windows zip and MSI, cross built on Linux with the same scripts as a
  # developer machine (S-044, S-051). Tag builds are signed with the
  # certificate in the release-signing environment (S-083): the exes are
  # signed before make-zip.sh packs them and before make-msi.sh embeds them,
  # the MSI is signed before upload, every signature carries an RFC 3161
  # timestamp, and the job verifies every signed artifact before it is
  # uploaded. The 0.4.0 certificate is self signed (a test signed release):
  # each step extracts the leaf certificate from the PKCS#12 and trusts it
  # when it is self signed, because a self signed signature cannot verify
  # against the system store. A CA issued certificate verifies against the
  # system store and needs none of this. A workflow_dispatch run skips the
  # signing steps with a notice and uploads unsigned artifacts; a tag build
  # without a certificate fails loudly. osslsigncode comes from Fedora's
  # repositories in the same container as wixl, the toolchain the tests
  # dry-run against.
  windows:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release-signing
    env:
      CI: true
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-windows
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 msitools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-windows"
      - run: scripts/windows/build.sh
      - name: Sign the executables (S-083)
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
          KAWARO_WIN_SIGN_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::notice::S-083 signing skipped: only tag builds are signed, this workflow_dispatch run uploads unsigned artifacts"
            exit 0
          fi
          if [ -z "${WINDOWS_SIGNING_PFX}" ] || [ -z "${WINDOWS_SIGNING_PASS}" ]; then
            echo "::error::S-083: no code signing certificate in the release-signing environment; a tag build must be signed"
            exit 1
          fi
          umask 077
          trap 'rm -f "${RUNNER_TEMP}/cert.pfx"' EXIT
          printf '%s' "${WINDOWS_SIGNING_PFX}" | base64 -d > "${RUNNER_TEMP}/cert.pfx"
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TEMP}:/rt" -w /w \
            -e CI=true -e KAWARO_WIN_SIGN_PASS \
            registry.fedoraproject.org/fedora:44 \
            bash -c 'set -e
              dnf install -y -q osslsigncode openssl
              openssl pkcs12 -in /rt/cert.pfx -passin env:KAWARO_WIN_SIGN_PASS -clcerts -nokeys -out /rt/cert.pem
              if [ "$(openssl x509 -in /rt/cert.pem -noout -subject | sed "s/^subject=//")" = "$(openssl x509 -in /rt/cert.pem -noout -issuer | sed "s/^issuer=//")" ]; then
                export KAWARO_WIN_SIGN_CAFILE=/rt/cert.pem
              fi
              scripts/windows/sign-local.sh pkcs12:/rt/cert.pfx --sign target-windows/x86_64-pc-windows-gnu/release/kawaro.exe target-windows/x86_64-pc-windows-gnu/release/kawarod.exe'
      - run: scripts/windows/make-zip.sh
      # Ubuntu's wixl (0.101) aborts on the RemoveFile element in
      # installer/windows/kawaro.wxs; Fedora's wixl (0.106) builds it.
      - name: MSI (wixl from Fedora)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w -e CI=true \
            -e CARGO_TARGET_DIR=/w/target-windows registry.fedoraproject.org/fedora:44 \
            bash -c 'dnf install -y -q msitools && scripts/windows/make-msi.sh'
      - name: Sign the MSI (S-083)
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
          KAWARO_WIN_SIGN_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::notice::S-083 signing skipped: only tag builds are signed, this workflow_dispatch run uploads unsigned artifacts"
            exit 0
          fi
          if [ -z "${WINDOWS_SIGNING_PFX}" ] || [ -z "${WINDOWS_SIGNING_PASS}" ]; then
            echo "::error::S-083: no code signing certificate in the release-signing environment; a tag build must be signed"
            exit 1
          fi
          umask 077
          trap 'rm -f "${RUNNER_TEMP}/cert.pfx"' EXIT
          printf '%s' "${WINDOWS_SIGNING_PFX}" | base64 -d > "${RUNNER_TEMP}/cert.pfx"
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TEMP}:/rt" -w /w \
            -e CI=true -e KAWARO_WIN_SIGN_PASS \
            registry.fedoraproject.org/fedora:44 \
            bash -c 'set -e
              dnf install -y -q osslsigncode openssl
              openssl pkcs12 -in /rt/cert.pfx -passin env:KAWARO_WIN_SIGN_PASS -clcerts -nokeys -out /rt/cert.pem
              if [ "$(openssl x509 -in /rt/cert.pem -noout -subject | sed "s/^subject=//")" = "$(openssl x509 -in /rt/cert.pem -noout -issuer | sed "s/^issuer=//")" ]; then
                export KAWARO_WIN_SIGN_CAFILE=/rt/cert.pem
              fi
              scripts/windows/sign-local.sh pkcs12:/rt/cert.pfx --sign target-windows/dist/kawaro-*-windows-x64.msi'
      - name: Verify the signatures (S-083)
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
          KAWARO_WIN_SIGN_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::notice::S-083 verification skipped: nothing was signed on this workflow_dispatch run"
            exit 0
          fi
          if [ -z "${WINDOWS_SIGNING_PFX}" ] || [ -z "${WINDOWS_SIGNING_PASS}" ]; then
            echo "::error::S-083: no code signing certificate in the release-signing environment; a tag build must be signed"
            exit 1
          fi
          umask 077
          trap 'rm -rf "${RUNNER_TEMP}/cert.pfx" "${RUNNER_TEMP}/zip-x"' EXIT
          printf '%s' "${WINDOWS_SIGNING_PFX}" | base64 -d > "${RUNNER_TEMP}/cert.pfx"
          rm -rf "${RUNNER_TEMP}/zip-x"
          mkdir -p "${RUNNER_TEMP}/zip-x"
          unzip -q target-windows/dist/kawaro-*-windows-x64.zip -d "${RUNNER_TEMP}/zip-x"
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -v "${RUNNER_TEMP}:/rt" -w /w \
            -e CI=true -e KAWARO_WIN_SIGN_PASS \
            registry.fedoraproject.org/fedora:44 \
            bash -c 'set -e
              dnf install -y -q osslsigncode openssl unzip
              openssl pkcs12 -in /rt/cert.pfx -passin env:KAWARO_WIN_SIGN_PASS -clcerts -nokeys -out /rt/cert.pem
              if [ "$(openssl x509 -in /rt/cert.pem -noout -subject | sed "s/^subject=//")" = "$(openssl x509 -in /rt/cert.pem -noout -issuer | sed "s/^issuer=//")" ]; then
                export KAWARO_WIN_SIGN_CAFILE=/rt/cert.pem
              fi
              scripts/windows/sign-local.sh pkcs12:/rt/cert.pfx --verify target-windows/x86_64-pc-windows-gnu/release/kawaro.exe target-windows/x86_64-pc-windows-gnu/release/kawarod.exe /rt/zip-x/kawaro-*-windows-x64/kawaro.exe /rt/zip-x/kawaro-*-windows-x64/kawarod.exe target-windows/dist/kawaro-*-windows-x64.msi'
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target-windows/dist/kawaro-*-windows-x64.zip
            target-windows/dist/kawaro-*-windows-x64.msi

  release:
    needs: [test, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      # GitHub stores `~` in asset names as `.` (ADR 0006): rename first so
      # SHA256SUMS names the files as they are published.
      - name: GitHub asset names
        run: scripts/release/github-names.sh dist
      - name: Checksums
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- *.rpm *.deb *.zip *.msi > SHA256SUMS
            test "$(wc -l < SHA256SUMS)" -eq 4
            sha256sum -c SHA256SUMS
          )
      - name: Create the release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            flags=()
            case "${GITHUB_REF_NAME}" in *-*) flags=(--prerelease) ;; esac
            gh release create "${GITHUB_REF_NAME}" "${flags[@]}" --verify-tag \
              --title "Kawaro ${version} | كوارو ${version}" --notes-file "docs/release-notes-${version}.md" \
              -R "${GITHUB_REPOSITORY}"
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/*.rpm dist/*.deb dist/*.zip dist/*.msi dist/SHA256SUMS \
            --clobber -R "${GITHUB_REPOSITORY}"

  # Signed update feed (S-053c, ADR 0006). The only job that sees the signing
  # secrets; they are whole env values here and nowhere else.
  update-manifest:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'M7MMAD-OMAR/kawaro'
    # 24.04: 22.04 has no minisign package.
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign jq
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      # The same names the release job published (ADR 0006).
      - name: GitHub asset names
        run: scripts/release/github-names.sh dist
      - name: Manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p feed
          version="${GITHUB_REF_NAME#v}"
          gh release view "${GITHUB_REF_NAME}" --json assets -R "${GITHUB_REPOSITORY}" > assets.json
          scripts/make-update-manifest.sh --dist dist beta "${version}" assets.json feed/beta.json
          case "${version}" in
            *-*) ;;
            *) scripts/make-update-manifest.sh --dist dist stable "${version}" assets.json feed/stable.json ;;
          esac
      - name: Sign
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_SIGNING_PASSWORD: ${{ secrets.UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "${RUNNER_TEMP}/update.key"' EXIT
          printf '%s' "$UPDATE_SIGNING_KEY" > "${RUNNER_TEMP}/update.key"
          for f in feed/*.json; do
            scripts/sign-update-manifest.sh "${RUNNER_TEMP}/update.key" "$f"
          done
      - name: Verify signatures
        run: |
          set -euo pipefail
          for f in feed/*.json; do
            minisign -V -p packaging/keys/kawaro-update.pub -m "$f"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view updates -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create updates --prerelease --latest=false \
              --title "Update feed | قناة التحديث" --notes "Signed update manifests (ADR 0006)." \
              -R "${GITHUB_REPOSITORY}"
          fi
          case "${GITHUB_REF_NAME}" in
            *-*) files=(feed/beta.json feed/beta.json.minisig) ;;
            *) files=(feed/stable.json feed/stable.json.minisig feed/beta.json feed/beta.json.minisig) ;;
          esac
          # One file at a time: a manifest is always uploaded before its
          # signature, so a new json never sits next to an old signature.
          for f in "${files[@]}"; do
            gh release upload updates "$f" --clobber -R "${GITHUB_REPOSITORY}"
          done
