<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" width="960" height="440"><title id="t">كيف تُفحص التحديثات</title><desc id="d">يُبنى الإصدار من وسم وينشر مع بيان موقّع. يفحصه التطبيق مرة في اليوم، ويتحقق من التوقيع قبل التنزيل ثم من الحجم والبصمة قبل التثبيت.</desc><style>
