</style><rect width="960" height="440" fill="#15130F" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#B3AA99"/></marker></defs><text class="head" x="930.0" y="34" text-anchor="start" font-size="15">تحديثات موقّعة، ولا شيء يعمل دون تحقق</text><rect class="box" x="730.0" y="70" width="200" height="100" rx="12"/><text class="t box-t" x="830.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600">وسم الإصدار</text><text class="t box-t" x="830.0" y="135.0" text-anchor="middle" font-size="15">البناء والاختبار تلقائيا</text><rect class="box" x="480.0" y="70" width="200" height="100" rx="12"/><text class="t box-t" x="580.0" y="105.5" text-anchor="middle" font-size="14" font-weight="600">إصدار GitHub</text><text class="t box-t" x="580.0" y="124.5" text-anchor="middle" font-size="14">DEB RPM MSI ZIP</text><text class="t box-t" x="580.0" y="143.5" text-anchor="middle" font-size="14">SHA256SUMS</text><rect class="box" x="230.0" y="70" width="200" height="100" rx="12"/><text class="t box-t" x="330.0" y="105.5" text-anchor="middle" font-size="14" font-weight="600">بيان موقّع</text><text class="t box-t" x="330.0" y="124.5" text-anchor="middle" font-size="14">minisign</text><text class="t box-t" x="330.0" y="143.5" text-anchor="middle" font-size="14">الحجم وSHA-256</text><rect class="hot" x="30.0" y="70" width="150" height="100" rx="12"/><text class="t hot-t" x="105.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600">التطبيق</text><text class="t hot-t" x="105.0" y="135.0" text-anchor="middle" font-size="15">يفحص يوميا</text><line class="ln" x1="730.0" y1="120" x2="680.0" y2="120" marker-end="url(#a)"/><line class="ln" x1="480.0" y1="120" x2="430.0" y2="120" marker-end="url(#a)"/><line class="ln" x1="180.0" y1="120" x2="230.0" y2="120" marker-end="url(#a)"/><rect class="box2" x="640.0" y="240" width="290" height="110" rx="12"/><text class="t box2-t" x="785.0" y="280.5" text-anchor="middle" font-size="14" font-weight="600">1. تحقق من التوقيع</text><text class="t box2-t" x="785.0" y="299.5" text-anchor="middle" font-size="14">بالمفتاح العام</text><text class="t box2-t" x="785.0" y="318.5" text-anchor="middle" font-size="14">المدمج في التطبيق</text><rect class="box2" x="330.0" y="240" width="290" height="110" rx="12"/><text class="t box2-t" x="475.0" y="280.5" text-anchor="middle" font-size="14" font-weight="600">2. نزّل</text><text class="t box2-t" x="475.0" y="299.5" text-anchor="middle" font-size="14">بعد ذلك فقط؛ وتحقق</text><text class="t box2-t" x="475.0" y="318.5" text-anchor="middle" font-size="14">من الحجم والبصمة</text><rect class="box2" x="20.0" y="240" width="290" height="110" rx="12"/><text class="t box2-t" x="165.0" y="280.5" text-anchor="middle" font-size="14" font-weight="600">3. ثبّت</text><text class="t box2-t" x="165.0" y="299.5" text-anchor="middle" font-size="14">ويندوز: صامت لحسابك</text><text class="t box2-t" x="165.0" y="318.5" text-anchor="middle" font-size="14">لينكس: توافق على الطلب</text><line class="ln" x1="105.0" y1="170" x2="105.0" y2="205" marker-end="url(#a)"/><line class="ln" x1="105.0" y1="205" x2="785.0" y2="205"/><line class="ln" x1="785.0" y1="205" x2="785.0" y2="240" marker-end="url(#a)"/><text class="t" x="930.0" y="402" text-anchor="start" font-size="13">نسخ البيتا تتبع قناة beta والمستقرة تتبع stable. وupdate_check = false يوقف الفحص.</text></svg>
