<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" width="960" height="560"><title id="t">إضافة صيغة</title><desc id="d">ملف إجراء بصيغة TOML يحدّد نوع المدخل والاسم، ومحوّل المحرك ينفّذ capabilities وestimate وrun، ويضمّهما السجل في خلية.</desc><style>
