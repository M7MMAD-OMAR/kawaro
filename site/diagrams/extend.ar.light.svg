</style><rect width="960" height="560" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><text class="head" x="930.0" y="34" text-anchor="start" font-size="15">صيغة جديدة تعني ملف TOML ومحوّلا صغيرا</text><rect class="box" x="670.0" y="60" width="260" height="150" rx="12"/><text class="t box-t" x="800.0" y="101.5" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">actions/pdf.toml</text><text class="t box-t" x="800.0" y="120.5" text-anchor="middle" font-size="14">id = &quot;pdf.merge&quot;</text><text class="t box-t" x="800.0" y="139.5" text-anchor="middle" font-size="14">accepts = [&quot;pdf&quot;]</text><text class="t box-t" x="800.0" y="158.5" text-anchor="middle" font-size="14">min_files = 2</text><text class="t box-t" x="800.0" y="177.5" text-anchor="middle" font-size="14">label = { ar, en }</text><rect class="box" x="350.0" y="60" width="260" height="150" rx="12"/><text class="t box-t" x="480.0" y="111.0" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">trait Engine</text><text class="t box-t" x="480.0" y="130.0" text-anchor="middle" font-size="14">capabilities()</text><text class="t box-t" x="480.0" y="149.0" text-anchor="middle" font-size="14">estimate(file, device)</text><text class="t box-t" x="480.0" y="168.0" text-anchor="middle" font-size="14">run(job, progress, cancel)</text><rect class="box" x="30.0" y="60" width="260" height="150" rx="12"/><text class="t box-t" x="160.0" y="120.0" text-anchor="middle" font-size="15" font-weight="600">السجل</text><text class="t box-t" x="160.0" y="140.0" text-anchor="middle" font-size="15">يحمّل الإجراءات المضمّنة</text><text class="t box-t" x="160.0" y="160.0" text-anchor="middle" font-size="15">وإجراءات المستخدم</text><line class="ln" x1="670.0" y1="135" x2="610.0" y2="135" marker-end="