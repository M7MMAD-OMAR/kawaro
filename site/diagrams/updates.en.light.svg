<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" width="960" height="440"><title id="t">How updates are checked</title><desc id="d">A release is built from a tag and published with a signed manifest. The app checks it once a day, verifies the signature before downloading, then checks size and hash before installing.</desc><style>
.box{fill:#F2EDE2;stroke:#D2C6AE;stroke-width:1}
.box2{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.zone{fill:#FAF7F0;stroke:#D2C6AE;stroke-width:1;stroke-dasharray:6 6}
.hot{fill:#D9921A;stroke:#D9921A}
.hex{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.hexhot{fill:#D9921A;stroke:#D9921A}
.hexc{fill:#DFD3BB;stroke:#D2C6AE;stroke-width:1}
.t{fill:#1F1A12} .t2{fill:#5C5446}
.hot-t{fill:#3A2500} .hexhot-t{fill:#3A2500}
.ln{stroke:#5C5446;stroke-width:2;fill:none}
.head{fill:#5C5446}
text{font-family:"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif}
</style><rect width="960" height="440" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><text class="head" x="30.0" y="34" text-anchor="start" font-size="15">Signed updates, nothing runs unverified</text><rect class="box" x="30.0" y="70" width="200" height="100" rx="12"/><text class="t box-t" x="130.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600">Tag v*</text><text class="t box-t" x="130.0" y="135.0" text-anchor="middle" font-size="15">CI builds and tests</text><rect class="box" x="280.0" y="70" width="200" height="100" rx="12"/><text class="t box-t" x="380.0" y="105.5" text-anchor="middle" font-size="14" font-weight="600">GitHub release</text><text class="t box-t" x="380.0" y="124.5" text-anchor="middle" font-size="14">DEB RPM MSI ZIP</text><text class="t box-t" x="380.0" y="143.5" text-anchor="middle" font-size="14">SHA256SUMS</text><rect class="box" x="530.0" y="70" width="200" height="100" rx="12"/><text class="t box-t" x="630.0" y="105.5" text-anchor="middle" font-size="14" font-weight="600">Signed manifest</text><text class="t box-t" x="630.0" y="124.5" text-anchor="middle" font-size="14">minisign</text><text class="t box-t" x="630.0" y="143.5" text-anchor="middle" font-size="14">size and SHA-256</text><rect class="hot" x="780.0" y="70" width="150" height="100" rx="12"/><text class="t hot-t" x="855.0" y="115.0" text-anchor="middle" font-size="15" font-weight="600">App</text><text class="t hot-t" x="855.0" y="135.0" text-anchor="middle" font-size="15">checks daily</text><line class="ln" x1="230.0" y1="120" x2="280.0" y2="120" marker-end="url(#a)"/><line class="ln" x1="480.0" y1="120" x2="530.0" y2="120" marker-end="url(#a)"/><line class="ln" x1="780.0" y1="120" x2="730.0" y2="120" marker-end="url(#a)"/><rect class="box2" x="30.0" y="240" width="290" height="110" rx="12"/><text class="t box2-t" x="175.0" y="280.5" text-anchor="middle" font-size="14" font-weight="600">1. Verify the signature</text><text class="t box2-t" x="175.0" y="299.5" text-anchor="middle" font-size="14">with the public key</text><text class="t box2-t" x="175.0" y="318.5" text-anchor="middle" font-size="14">built into the app</text><rect class="box2" x="340.0" y="240" width="290" height="110" rx="12"/><text class="t box2-t" x="485.0" y="280.5" text-anchor="middle" font-size="14" font-weight="600">2. Download</text><text class="t box2-t" x="485.0" y="299.5" text-anchor="middle" font-size="14">only then; check</text><text class="t box2-t" x="485.0" y="318.5" text-anchor="middle" font-size="14">size and SHA-256</text><rect class="box2" x="650.0" y="240" width="290" height="110" rx="12"/><text class="t box2-t" x="795.0" y="280.5" text-anchor="middle" font-size="14" font-weight="600">3. Install</text><text class="t box2-t" x="795.0" y="299.5" text-anchor="middle" font-size="14">Windows: quiet, per user</text><text class="t box2-t" x="795.0" y="318.5" text-anchor="middle" font-size="14">Linux: you approve the prompt</text><line class="ln" x1="855.0" y1="170" x2="855.0" y2="205" marker-end="url(#a)"/><line class="ln" x1="855.0" y1="205" x2="175.0" y2="205"/><line class="ln" x1="175.0" y1="205" x2="175.0" y2="240" marker-end="url(#a)"/><text class="t" x="30.0" y="402" text-anchor="start" font-size="13">Beta builds follow the beta channel; stable builds follow stable. update_check = false turns it off.</text></svg>
