<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" width="960" height="560"><title id="t">From right click to result</title><desc id="d">Seven steps: select files, right click, filter actions, show the hive, click a cell, the engine runs, the result lands beside the original.</desc><style>
.box{fill:#F2EDE2;stroke:#D2C6AE;stroke-width:1}
.box2{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.zone{fill:#FAF7F0;stroke:#D2C6AE;stroke-width:1;stroke-dasharray:6 6}
.hot{fill:#D9921A;stroke:#D9921A}
.hex{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.hexhot{fill:#D9921A;stroke:#D9921A}
.hexc{fill:#DFD3BB;stroke:#D2C6AE;stroke-width:1}
.t{fill:#1F1A12} .t2{fill:#5C5446}
.hot-t{fill:#3A2500} .hexhot-t{fill:#3A2500}
.ln{stroke:#5C5446;stroke-width:2;fill:none}
.head{fill:#5C5446}
text{font-family:"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif}
</style><rect width="960" height="560" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><path class="hex" d="M110.0,68.0L163.7,99.0L163.7,161.0L110.0,192.0L56.3,161.0L56.3,99.0Z"/><text class="t" x="110.0" y="141" text-anchor="middle" font-size="32" font-weight="600">1</text><text class="t" x="110.0" y="222" text-anchor="middle" font-size="16">Select files</text><text class="t2" x="110.0" y="244" text-anchor="middle" font-size="13">in the file manager</text><path class="hex" d="M330.0,68.0L383.7,99.0L383.7,161.0L330.0,192.0L276.3,161.0L276.3,99.0Z"/><text class="t" x="330.0" y="141" text-anchor="middle" font-size="32" font-weight="600">2</text><text class="t" x="330.0" y="222" text-anchor="middle" font-size="16">Right click</text><text class="t2" x="330.0" y="244" text-anchor="middle" font-size="13" font-family="ui-monospace, 'IBM Plex Mono', monospace">sbarhive open</text><path class="hex" d="M550.0,68.0L603.7,99.0L603.7,161.0L550.0,192.0L496.3,161.0L496.3,99.0Z"/><text class="t" x="550.0" y="141" text-anchor="middle" font-size="32" font-weight="600">3</text><text class="t" x="550.0" y="222" text-anchor="middle" font-size="16">Filter actions</text><text class="t2" x="550.0" y="244" text-anchor="middle" font-size="13">kind, count, tools found</text><path class="hexhot" d="M770.0,68.0L823.7,99.0L823.7,161.0L770.0,192.0L716.3,161.0L716.3,99.0Z"/><text class="hexhot-t" x="770.0" y="141" text-anchor="middle" font-size="32" font-weight="600">4</text><text class="t" x="770.0" y="222" text-anchor="middle" font-size="16">Show the hive</text><text class="t2" x="770.0" y="244" text-anchor="middle" font-size="13">only cells that fit</text><path class="hex" d="M220.0,308.0L273.7,339.0L273.7,401.0L220.0,432.0L166.3,401.0L166.3,339.0Z"/><text class="t" x="220.0" y="381" text-anchor="middle" font-size="32" font-weight="600">5</text><text class="t" x="220.0" y="462" text-anchor="middle" font-size="16">Click a cell</text><text class="t2" x="220.0" y="484" text-anchor="middle" font-size="13">a job joins the queue</text><path class="hex" d="M440.0,308.0L493.7,339.0L493.7,401.0L440.0,432.0L386.3,401.0L386.3,339.0Z"/><text class="t" x="440.0" y="381" text-anchor="middle" font-size="32" font-weight="600">6</text><text class="t" x="440.0" y="462" text-anchor="middle" font-size="16">Engine runs</text><text class="t2" x="440.0" y="484" text-anchor="middle" font-size="13">writes a temp file</text><path class="hexhot" d="M660.0,308.0L713.7,339.0L713.7,401.0L660.0,432.0L606.3,401.0L606.3,339.0Z"/><text class="hexhot-t" x="660.0" y="381" text-anchor="middle" font-size="32" font-weight="600">7</text><text class="t" x="660.0" y="462" text-anchor="middle" font-size="16">Result beside the original</text><text class="t2" x="660.0" y="484" text-anchor="middle" font-size="13">atomic rename, tray note</text><line class="ln" x1="180.0" y1="130" x2="260.0" y2="130" marker-end="url(#a)"/><line class="ln" x1="400.0" y1="130" x2="480.0" y2="130" marker-end="url(#a)"/><line class="ln" x1="620.0" y1="130" x2="700.0" y2="130" marker-end="url(#a)"/><line class="ln" x1="770.0" y1="262" x2="770.0" y2="282"/><line class="ln" x1="770.0" y1="282" x2="220.0" y2="282"/><line class="ln" x1="220.0" y1="282" x2="220.0" y2="304" marker-end="url(#a)"/><line class="ln" x1="290.0" y1="370" x2="370.0" y2="370" marker-end="url(#a)"/><line class="ln" x1="510.0" y1="370" x2="590.0" y2="370" marker-end="url(#a)"/><text class="t" x="480.0" y="526" text-anchor="middle" font-size="16">The original file is never modified.</text></svg>
