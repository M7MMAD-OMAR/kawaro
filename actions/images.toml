# Built-in image actions (engine = "image"). Ops and params follow the
# "Image engine operations" table in docs/architecture.md.
# Ring 1 holds at most 6 cells, ring 2 at most 12.
# Cell codes: format codes stay Latin in both languages; transforms use a
# short word. The full label shows in the centre cell on hover.

# Ring 1: the common conversions.

[[action]]
id = "image.to-webp"
engine = "image"
op = "convert"
ring = 1
order = 10
accepts = ["image"]
skip_ext = ["webp"]
output = { mode = "per-file", ext = "webp" }
code = { ar = "WEBP", en = "WEBP" }
label = { ar = "تحويل إلى WebP", en = "Convert to WebP" }
icon = "image"
[action.params]
quality = 85
[action.options]
kind = "form"
[[action.options.field]]
id = "quality"
type = "int"
label = { ar = "الجودة", en = "Quality" }
default = 85
min = 1
max = 100
maps_to = "quality"
unit = "%"

[[action]]
id = "image.to-png"
engine = "image"
op = "convert"
ring = 1
order = 20
accepts = ["image"]
skip_ext = ["png"]
output = { mode = "per-file", ext = "png" }
code = { ar = "PNG", en = "PNG" }
label = { ar = "تحويل إلى PNG", en = "Convert to PNG" }
icon = "image"

[[action]]
id = "image.to-jpg"
engine = "image"
op = "convert"
ring = 1
order = 30
accepts = ["image"]
skip_ext = ["jpg", "jpeg", "jpe"]
output = { mode = "per-file", ext = "jpg" }
code = { ar = "JPG", en = "JPG" }
label = { ar = "تحويل إلى JPG", en = "Convert to JPG" }
icon = "image"
[action.params]
quality = 90
keep_metadata = false
[action.options]
kind = "form"
[[action.options.field]]
id = "quality"
type = "int"
label = { ar = "الجودة", en = "Quality" }
default = 90
min = 1
max = 100
maps_to = "quality"
unit = "%"

[[action.options.field]]
id = "keep_metadata"
type = "bool"
label = { ar = "الاحتفاظ بالبيانات الوصفية (JPEG فقط)", en = "Keep metadata (JPEG only)" }
default = false
maps_to = "keep_metadata"

[[action]]
id = "image.to-avif"
engine = "image"
op = "convert"
ring = 1
order = 40
accepts = ["image"]
skip_ext = ["avif"]
output = { mode = "per-file", ext = "avif" }
code = { ar = "AVIF", en = "AVIF" }
label = { ar = "تحويل إلى AVIF", en = "Convert to AVIF" }
icon = "image"
[action.params]
quality = 70
[action.options]
kind = "form"
[[action.options.field]]
id = "quality"
type = "int"
label = { ar = "الجودة", en = "Quality" }
default = 70
min = 1
max = 100
maps_to = "quality"
unit = "%"

[[action]]
id = "image.to-pdf"
engine = "image"
op = "to-pdf"
ring = 1
order = 50
accepts = ["image"]
min_files = 1
output = { mode = "combined", ext = "pdf" }
code = { ar = "PDF", en = "PDF" }
label = { ar = "دمج الصور في ملف PDF واحد", en = "Combine into one PDF" }
icon = "pdf"
[action.params]
page = "fit"
page_size = "fit"
orientation = "auto"
margin_mm = 0.0
dpi = 72
[action.options]
kind = "form"
[[action.options.field]]
id = "page_size"
type = "enum"
label = { ar = "حجم الصفحة", en = "Page size" }
default = "fit"
maps_to = "page_size"
[[action.options.field.values]]
id = "fit"
label = { ar = "ملائم للصورة", en = "Fit image" }
[[action.options.field.values]]
id = "a4"
label = { ar = "A4", en = "A4" }
[[action.options.field.values]]
id = "letter"
label = { ar = "Letter", en = "Letter" }
[[action.options.field]]
id = "orientation"
type = "enum"
label = { ar = "الاتجاه", en = "Orientation" }
default = "auto"
maps_to = "orientation"
[[action.options.field.values]]
id = "auto"
label = { ar = "تلقائي", en = "Auto" }
[[action.options.field.values]]
id = "portrait"
label = { ar = "عمودي", en = "Portrait" }
[[action.options.field.values]]
id = "landscape"
label = { ar = "أفقي", en = "Landscape" }
[[action.options.field]]
id = "margin_mm"
type = "float"
label = { ar = "الهامش", en = "Margin" }
default = 0.0
min = 0.0
max = 50.0
unit = "mm"
maps_to = "margin_mm"
[[action.options.field]]
id = "dpi"
type = "int"
label = { ar = "الدقة", en = "Resolution" }
default = 72
min = 72
max = 600
maps_to = "dpi"

[[action]]
id = "image.to-ico"
engine = "image"
op = "convert"
ring = 1
order = 60
accepts = ["image"]
skip_ext = ["ico"]
output = { mode = "per-file", ext = "ico" }
code = { ar = "ICO", en = "ICO" }
label = { ar = "تحويل إلى أيقونة ICO", en = "Convert to ICO" }
icon = "icon"

# Ring 2: transforms keep the input format and add a suffix, then the
# less common formats.

[[action]]
id = "image.resize-50"
engine = "image"
op = "resize"
ring = 2
order = 10
accepts = ["image"]
output = { mode = "per-file", suffix = "-50" }
code = { ar = "50%", en = "50%" }
label = { ar = "تصغير إلى النصف", en = "Resize to 50%" }
icon = "resize"
[action.params]
scale = 50
keep_metadata = false
[action.options]
kind = "form"
readout = ["dimensions", "ratio", "percent", "output_name"]
[[action.options.field]]
id = "scale"
type = "percent"
label = { ar = "النسبة المئوية", en = "Percent" }
default = 50
min = 1
max = 1000
maps_to = "scale"
clears = ["max_side"]
[[action.options.field]]
id = "max_side"
type = "px"
label = { ar = "أقصى ضلع", en = "Max side" }
default = 1920
min = 16
max = 20000
maps_to = "max_side"
clears = ["scale"]

[[action.options.field]]
id = "keep_metadata"
type = "bool"
label = { ar = "الاحتفاظ بالبيانات الوصفية (JPEG فقط)", en = "Keep metadata (JPEG only)" }
default = false
maps_to = "keep_metadata"

[[action]]
