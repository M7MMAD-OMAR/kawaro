[[action]]
id = "image.resize-to"
engine = "image"
op = "resize-box"
ring = 2
order = 110
accepts = ["image"]
output = { mode = "per-file", suffix = "-resized" }
code = { ar = "إطار", en = "BOX" }
label = { ar = "تغيير الحجم إلى قياس محدد", en = "Resize to a size" }
icon = "fit"
[action.params]
width = 1920
height = 1080
mode = "fit"
keep_metadata = false

[action.options]
kind = "form"

[[action.options.field]]
id = "width"
type = "int"
label = { ar = "العرض", en = "Width" }
default = 1920
min = 16
max = 20000
unit = "px"
maps_to = "width"

[[action.options.field]]
id = "height"
type = "int"
label = { ar = "الارتفاع", en = "Height" }
default = 1080
min = 16
max = 20000
unit = "px"
maps_to = "height"

[[action.options.field]]
id = "mode"
type = "enum"
label = { ar = "الطريقة", en = "Method" }
default = "fit"
values = [
  { id = "fit", label = { ar = "داخل الإطار", en = "Fit inside" } },
  { id = "fill", label = { ar = "تغطية الإطار", en = "Fill the box" } },
  { id = "exact", label = { ar = "القياس بالضبط", en = "Exact size" } },
]
maps_to = "mode"

[[action.options.field]]
id = "keep_metadata"
type = "bool"
label = { ar = "الاحتفاظ بالبيانات الوصفية (JPEG فقط)", en = "Keep metadata (JPEG only)" }
default = false
maps_to = "keep_metadata"

