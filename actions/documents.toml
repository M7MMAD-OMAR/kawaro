# Office documents through LibreOffice (engine "office", S-009).
# The schema has no "only these extensions" field, so each conversion lists
# the other families in skip_ext: a spreadsheet never offers DOCX. A mixed
# selection can still show it; the engine then rejects the wrong family.

[[action]]
id = "documents.to-pdf"
engine = "office"
op = "to-pdf"
ring = 1
order = 10
accepts = ["document"]
output = { mode = "per-file", ext = "pdf" }
code = { ar = "PDF", en = "PDF" }
label = { ar = "تحويل إلى PDF", en = "Convert to PDF" }

[[action]]
id = "documents.to-docx"
engine = "office"
op = "convert-doc"
ring = 1
order = 20
accepts = ["document"]
skip_ext = ["docx", "xls", "xlsx", "ods", "csv", "ppt", "pptx", "odp"]
output = { mode = "per-file", ext = "docx" }
code = { ar = "DOCX", en = "DOCX" }
label = { ar = "تحويل إلى DOCX", en = "Convert to DOCX" }

