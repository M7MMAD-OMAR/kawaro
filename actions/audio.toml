# Audio actions, run by the FFmpeg engine (crates/engines/src/ffmpeg.rs).
# Schema: crates/core/src/action.rs. Story: backlog/S-008-ffmpeg-engine.md.

[[action]]
id = "audio.to-mp3"
engine = "ffmpeg"
op = "convert-audio"
ring = 1
order = 10
accepts = ["audio"]
skip_ext = ["mp3"]
output = { mode = "per-file", ext = "mp3" }
code = { ar = "MP3", en = "MP3" }
label = { ar = "تحويل إلى MP3", en = "Convert to MP3" }

