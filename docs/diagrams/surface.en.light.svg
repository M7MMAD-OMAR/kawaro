<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d" width="960" height="480"><title id="t">Choosing the hive surface</title><desc id="d">A forced setting wins. Otherwise the layer path needs Wayland with four protocol globals and no running screen reader; anything else uses an ordinary window.</desc><style>
.box{fill:#F2EDE2;stroke:#D2C6AE;stroke-width:1}
.box2{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.zone{fill:#FAF7F0;stroke:#D2C6AE;stroke-width:1;stroke-dasharray:6 6}
.hot{fill:#D9921A;stroke:#D9921A}
.hex{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.hexhot{fill:#D9921A;stroke:#D9921A}
.hexc{fill:#DFD3BB;stroke:#D2C6AE;stroke-width:1}
.t{fill:#1F1A12} .t2{fill:#5C5446}
.hot-t{fill:#1F1200} .hexhot-t{fill:#1F1200}
.ln{stroke:#5C5446;stroke-width:2;fill:none}
.head{fill:#5C5446}
text{font-family:"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif}
</style><rect width="960" height="480" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><text class="head" x="30.0" y="34" text-anchor="start" font-size="15">Where the hive is drawn, chosen at every show</text><rect class="box" x="30.0" y="70" width="250" height="100" rx="12"/><text class="t box-t" x="155.0" y="96.0" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">Forced?</text><text class="t box-t" x="155.0" y="115.0" text-anchor="middle" font-size="14">hive_surface</text><text class="t box-t" x="155.0" y="134.0" text-anchor="middle" font-size="14">KAWARO_SURFACE</text><text class="t box-t" x="155.0" y="153.0" text-anchor="middle" font-size="14">yes: that path wins</text><rect class="box" x="350.0" y="70" width="250" height="100" rx="12"/><text class="t box-t" x="475.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600">Wayland with four globals?</text><text class="t box-t" x="475.0" y="124.0" text-anchor="middle" font-size="13">layer-shell, subcompositor</text><text class="t box-t" x="475.0" y="142.0" text-anchor="middle" font-size="13">viewporter, single-pixel-buffer</text><rect class="box" x="670.0" y="70" width="250" height="100" rx="12"/><text class="t box-t" x="795.0" y="115.0" text-anchor="middle" font-size="14" font-weight="600">Screen reader running?</text><text class="t box-t" x="795.0" y="134.0" text-anchor="middle" font-size="14">not just the flag</text><line class="ln" x1="280.0" y1="120" x2="350.0" y2="120" marker-end="url(#a)"/><text class="t2" x="315.0" y="108" text-anchor="middle" font-size="13">no</text><line class="ln" x1="600.0" y1="120" x2="670.0" y2="120" marker-end="url(#a)"/><text class="t2" x="635.0" y="108" text-anchor="middle" font-size="13">yes</text><rect class="box2" x="350.0" y="290" width="250" height="100" rx="12"/><text class="t box2-t" x="475.0" y="325.0" text-anchor="middle" font-size="15" font-weight="600">Window path</text><text class="t box2-t" x="475.0" y="345.0" text-anchor="middle" font-size="15">centred, ordinary window</text><text class="t box2-t" x="475.0" y="365.0" text-anchor="middle" font-size="15">GNOME, X11, Windows</text><rect class="hot" x="670.0" y="290" width="250" height="100" rx="12"/><text class="t hot-t" x="795.0" y="325.0" text-anchor="middle" font-size="15" font-weight="600">Layer path</text><text class="t hot-t" x="795.0" y="345.0" text-anchor="middle" font-size="15">at the pointer or the drag</text><text class="t hot-t" x="795.0" y="365.0" text-anchor="middle" font-size="15">Hyprland, KDE, wlroots</text><line class="ln" x1="475.0" y1="170" x2="475.0" y2="290" marker-end="url(#a)"/><text class="t2" x="490.0" y="235" text-anchor="start" font-size="13">no</text><line class="ln" x1="795.0" y1="170" x2="795.0" y2="290" marker-end="url(#a)"/><text class="t2" x="810.0" y="235" text-anchor="start" font-size="13">no</text><line class="ln" x1="700.0" y1="170" x2="600.0" y2="290" marker-end="url(#a)" stroke-dasharray="6 6"/><text class="t2" x="668.0" y="245" text-anchor="middle" font-size="13">yes</text><text class="t" x="30.0" y="440" text-anchor="start" font-size="14">Never assume layer shell exists. Every change of choice is logged once.</text></svg>
