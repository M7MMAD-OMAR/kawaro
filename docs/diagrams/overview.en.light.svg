<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t d" width="960" height="640"><title id="t">Kawaro processes</title><desc id="d">A file manager entry calls kawaro open, which sends a request over a local socket to the daemon. The daemon holds the hive, the queue, the tray, the action registry and the engines. Heavy tools run as separate child processes.</desc><style>
.box{fill:#F2EDE2;stroke:#D2C6AE;stroke-width:1}
.box2{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.zone{fill:#FAF7F0;stroke:#D2C6AE;stroke-width:1;stroke-dasharray:6 6}
.hot{fill:#D9921A;stroke:#D9921A}
.hex{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.hexhot{fill:#D9921A;stroke:#D9921A}
.hexc{fill:#DFD3BB;stroke:#D2C6AE;stroke-width:1}
.t{fill:#1F1A12} .t2{fill:#5C5446}
.hot-t{fill:#1F1200} .hexhot-t{fill:#1F1200}
.ln{stroke:#5C5446;stroke-width:2;fill:none}
.head{fill:#5C5446}
text{font-family:"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif}
</style><rect width="960" height="640" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><text class="head" x="30.0" y="34" text-anchor="start" font-size="15">Who talks to whom</text><rect class="box" x="30.0" y="56" width="190" height="74" rx="12"/><text class="t box-t" x="125.0" y="78.5" text-anchor="middle" font-size="14" font-weight="600">File manager</text><text class="t box-t" x="125.0" y="97.5" text-anchor="middle" font-size="14">Dolphin Nautilus</text><text class="t box-t" x="125.0" y="116.5" text-anchor="middle" font-size="14">Nemo Thunar Explorer</text><rect class="box" x="300.0" y="56" width="190" height="74" rx="12"/><text class="t box-t" x="395.0" y="88.0" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">kawaro open</text><text class="t box-t" x="395.0" y="107.0" text-anchor="middle" font-size="14">CLI, starts the daemon</text><rect class="box" x="570.0" y="56" width="190" height="74" rx="12"/><text class="t box-t" x="665.0" y="78.5" text-anchor="middle" font-size="14" font-weight="600">IPC</text><text class="t box-t" x="665.0" y="97.5" text-anchor="middle" font-size="14">Unix socket</text><text class="t box-t" x="665.0" y="116.5" text-anchor="middle" font-size="14">named pipe on Windows</text><line class="ln" x1="220.0" y1="93" x2="300.0" y2="93" marker-end="url(#a)"/><line class="ln" x1="490.0" y1="93" x2="570.0" y2="93" marker-end="url(#a)"/><rect class="zone" x="30.0" y="170" width="900" height="300" rx="16"/><text class="head" x="50.0" y="198" text-anchor="start" font-size="15">kawarod  (crates/daemon)  the only process with UI</text><rect class="box" x="60.0" y="220" width="250" height="84" rx="12"/><text class="t box-t" x="185.0" y="247.5" text-anchor="middle" font-size="14" font-weight="600">Hive</text><text class="t box-t" x="185.0" y="266.5" text-anchor="middle" font-size="14">Slint, software renderer</text><text class="t box-t" x="185.0" y="285.5" text-anchor="middle" font-size="14">crates/ui</text><rect class="box" x="350.0" y="220" width="250" height="84" rx="12"/><text class="t box-t" x="475.0" y="247.5" text-anchor="middle" font-size="14" font-weight="600">Queue and events</text><text class="t box-t" x="475.0" y="266.5" text-anchor="middle" font-size="14">cancel, progress, atomic rename</text><text class="t box-t" x="475.0" y="285.5" text-anchor="middle" font-size="14">crates/core</text><rect class="box" x="640.0" y="220" width="250" height="84" rx="12"/><text class="t box-t" x="765.0" y="247.5" text-anchor="middle" font-size="14" font-weight="600">Tray and notifications</text><text class="t box-t" x="765.0" y="266.5" text-anchor="middle" font-size="14">progress in the tooltip</text><text class="t box-t" x="765.0" y="285.5" text-anchor="middle" font-size="14">crates/daemon</text><rect class="box" x="60.0" y="350" width="250" height="84" rx="12"/><text class="t box-t" x="185.0" y="377.5" text-anchor="middle" font-size="14" font-weight="600">Action registry</text><text class="t box-t" x="185.0" y="396.5" text-anchor="middle" font-size="14">actions/*.toml</text><text class="t box-t" x="185.0" y="415.5" text-anchor="middle" font-size="14">what fits this selection</text><rect class="box" x="350.0" y="350" width="250" height="84" rx="12"/><text class="t box-t" x="475.0" y="377.5" text-anchor="middle" font-size="14" font-weight="600">Engines</text><text class="t box-t" x="475.0" y="396.5" text-anchor="middle" font-size="14">one adapter per engine</text><text class="t box-t" x="475.0" y="415.5" text-anchor="middle" font-size="14">crates/engines</text><rect class="box2" x="640.0" y="350" width="250" height="84" rx="12"/><text class="t box2-t" x="765.0" y="377.5" text-anchor="middle" font-size="14" font-weight="600">Design tokens</text><text class="t box2-t" x="765.0" y="396.5" text-anchor="middle" font-size="14">design/tokens.json</text><text class="t box2-t" x="765.0" y="415.5" text-anchor="middle" font-size="14">generated into the UI</text><line class="ln" x1="665.0" y1="130" x2="665.0" y2="170" marker-end="url(#a)"/><line class="ln" x1="185.0" y1="350" x2="185.0" y2="304" marker-end="url(#a)"/><line class="ln" x1="310.0" y1="262" x2="350.0" y2="262" marker-end="url(#a)"/><line class="ln" x1="475.0" y1="304" x2="475.0" y2="350" marker-end="url(#a)"/><line class="ln" x1="600.0" y1="262" x2="640.0" y2="262" marker-end="url(#a)" stroke-dasharray="6 6"/><line class="ln" x1="765.0" y1="350" x2="765.0" y2="304" marker-end="url(#a)" stroke-dasharray="6 6"/><text class="head" x="30.0" y="626" text-anchor="start" font-size="14">Heavy engines run as separate processes</text><rect class="box2" x="60.0" y="524" width="250" height="74" rx="12"/><text class="t box2-t" x="185.0" y="556.0" text-anchor="middle" font-size="15" font-weight="600">FFmpeg</text><text class="t box2-t" x="185.0" y="576.0" text-anchor="middle" font-size="15">video, audio</text><line class="ln" x1="475.0" y1="434" x2="185.0" y2="524" marker-end="url(#a)" stroke-dasharray="6 6"/><rect class="box2" x="350.0" y="524" width="250" height="74" rx="12"/><text class="t box2-t" x="475.0" y="556.0" text-anchor="middle" font-size="15" font-weight="600">LibreOffice</text><text class="t box2-t" x="475.0" y="576.0" text-anchor="middle" font-size="15">documents</text><line class="ln" x1="475.0" y1="434" x2="475.0" y2="524" marker-end="url(#a)" stroke-dasharray="6 6"/><rect class="box2" x="640.0" y="524" width="250" height="74" rx="12"/><text class="t box2-t" x="765.0" y="556.0" text-anchor="middle" font-size="15" font-weight="600">Ghostscript</text><text class="t box2-t" x="765.0" y="576.0" text-anchor="middle" font-size="15">PDF</text><line class="ln" x1="475.0" y1="434" x2="765.0" y2="524" marker-end="url(#a)" stroke-dasharray="6 6"/><text class="t2" x="930.0" y="626" text-anchor="end" font-size="12">Cancel kills every child and its whole tree</text></svg>
