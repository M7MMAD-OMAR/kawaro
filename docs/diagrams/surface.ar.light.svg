<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d" width="960" height="480"><title id="t">اختيار سطح الخلية</title><desc id="d">الإعداد المفروض يغلب. وإلا فمسار الطبقة يحتاج ويلاند مع أربع واجهات بروتوكول وبلا قارئ شاشة يعمل، وغير ذلك يُستعمل نافذة عادية.</desc><style>
.box{fill:#F2EDE2;stroke:#D2C6AE;stroke-width:1}
.box2{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.zone{fill:#FAF7F0;stroke:#D2C6AE;stroke-width:1;stroke-dasharray:6 6}
.hot{fill:#D9921A;stroke:#D9921A}
.hex{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.hexhot{fill:#D9921A;stroke:#D9921A}
.hexc{fill:#DFD3BB;stroke:#D2C6AE;stroke-width:1}
.t{fill:#1F1A12} .t2{fill:#5C5446}
.hot-t{fill:#1F1200} .hexhot-t{fill:#1F1200}
.ln{stroke:#5C5446;stroke-width:2;fill:none}
.head{fill:#5C5446}
text{font-family:"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif;direction:rtl;unicode-bidi:embed}
</style><rect width="960" height="480" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><text class="head" x="930.0" y="34" text-anchor="start" font-size="15">أين تُرسم الخلية، يُحسم عند كل عرض</text><rect class="box" x="680.0" y="70" width="250" height="100" rx="12"/><text class="t box-t" x="805.0" y="96.0" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">هل فُرض؟</text><text class="t box-t" x="805.0" y="115.0" text-anchor="middle" font-size="14">hive_surface</text><text class="t box-t" x="805.0" y="134.0" text-anchor="middle" font-size="14">KAWARO_SURFACE</text><text class="t box-t" x="805.0" y="153.0" text-anchor="middle" font-size="14">نعم: يغلب ذلك المسار</text><rect class="box" x="360.0" y="70" width="250" height="100" rx="12"/><text class="t box-t" x="485.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600">ويلاند مع أربع واجهات؟</text><text class="t box-t" x="485.0" y="124.0" text-anchor="middle" font-size="13">layer-shell, subcompositor</text><text class="t box-t" x="485.0" y="142.0" text-anchor="middle" font-size="13">viewporter, single-pixel-buffer</text><rect class="box" x="40.0" y="70" width="250" height="100" rx="12"/><text class="t box-t" x="165.0" y="115.0" text-anchor="middle" font-size="14" font-weight="600">هل يعمل قارئ شاشة؟</text><text class="t box-t" x="165.0" y="134.0" text-anchor="middle" font-size="14">لا العلَم وحده</text><line class="ln" x1="680.0" y1="120" x2="610.0" y2="120" marker-end="url(#a)"/><text class="t2" x="645.0" y="108" text-anchor="middle" font-size="13">لا</text><line class="ln" x1="360.0" y1="120" x2="290.0" y2="120" marker-end="url(#a)"/><text class="t2" x="325.0" y="108" text-anchor="middle" font-size="13">نعم</text><rect class="box2" x="360.0" y="290" width="250" height="100" rx="12"/><text class="t box2-t" x="485.0" y="325.0" text-anchor="middle" font-size="15" font-weight="600">مسار النافذة</text><text class="t box2-t" x="485.0" y="345.0" text-anchor="middle" font-size="15">نافذة عادية في الوسط</text><text class="t box2-t" x="485.0" y="365.0" text-anchor="middle" font-size="15">GNOME وX11 وويندوز</text><rect class="hot" x="40.0" y="290" width="250" height="100" rx="12"/><text class="t hot-t" x="165.0" y="325.0" text-anchor="middle" font-size="15" font-weight="600">مسار الطبقة</text><text class="t hot-t" x="165.0" y="345.0" text-anchor="middle" font-size="15">عند المؤشر أو السحب</text><text class="t hot-t" x="165.0" y="365.0" text-anchor="middle" font-size="15">هايبرلاند وKDE وwlroots</text><line class="ln" x1="485.0" y1="170" x2="485.0" y2="290" marker-end="url(#a)"/><text class="t2" x="470.0" y="235" text-anchor="start" font-size="13">لا</text><line class="ln" x1="165.0" y1="170" x2="165.0" y2="290" marker-end="url(#a)"/><text class="t2" x="150.0" y="235" text-anchor="start" font-size="13">لا</text><line class="ln" x1="260.0" y1="170" x2="360.0" y2="290" marker-end="url(#a)" stroke-dasharray="6 6"/><text class="t2" x="292.0" y="245" text-anchor="middle" font-size="13">نعم</text><text class="t" x="930.0" y="440" text-anchor="start" font-size="14">لا يُفترض وجود layer shell أبدا. كل تغيير في الاختيار يُسجَّل مرة.</text></svg>
