<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" width="960" height="560"><title id="t">Adding a format</title><desc id="d">An action file in TOML names the input kind and the label. An engine adapter implements capabilities, estimate and run. The registry joins them into a hive cell.</desc><style>
.box{fill:#F2EDE2;stroke:#D2C6AE;stroke-width:1}
.box2{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.zone{fill:#FAF7F0;stroke:#D2C6AE;stroke-width:1;stroke-dasharray:6 6}
.hot{fill:#D9921A;stroke:#D9921A}
.hex{fill:#E9E1D0;stroke:#D2C6AE;stroke-width:1}
.hexhot{fill:#D9921A;stroke:#D9921A}
.hexc{fill:#DFD3BB;stroke:#D2C6AE;stroke-width:1}
.t{fill:#1F1A12} .t2{fill:#5C5446}
.hot-t{fill:#1F1200} .hexhot-t{fill:#1F1200}
.ln{stroke:#5C5446;stroke-width:2;fill:none}
.head{fill:#5C5446}
text{font-family:"IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif}
</style><rect width="960" height="560" fill="#FAF7F0" rx="16"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5C5446"/></marker></defs><text class="head" x="30.0" y="34" text-anchor="start" font-size="15">A new format is a TOML file and a small adapter</text><rect class="box" x="30.0" y="60" width="260" height="150" rx="12"/><text class="t box-t" x="160.0" y="101.5" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">actions/pdf.toml</text><text class="t box-t" x="160.0" y="120.5" text-anchor="middle" font-size="14">id = &quot;pdf.merge&quot;</text><text class="t box-t" x="160.0" y="139.5" text-anchor="middle" font-size="14">accepts = [&quot;pdf&quot;]</text><text class="t box-t" x="160.0" y="158.5" text-anchor="middle" font-size="14">min_files = 2</text><text class="t box-t" x="160.0" y="177.5" text-anchor="middle" font-size="14">label = { ar, en }</text><rect class="box" x="350.0" y="60" width="260" height="150" rx="12"/><text class="t box-t" x="480.0" y="111.0" text-anchor="middle" font-size="14" font-family="ui-monospace, 'IBM Plex Mono', monospace">trait Engine</text><text class="t box-t" x="480.0" y="130.0" text-anchor="middle" font-size="14">capabilities()</text><text class="t box-t" x="480.0" y="149.0" text-anchor="middle" font-size="14">estimate(file, device)</text><text class="t box-t" x="480.0" y="168.0" text-anchor="middle" font-size="14">run(job, progress, cancel)</text><rect class="box" x="670.0" y="60" width="260" height="150" rx="12"/><text class="t box-t" x="800.0" y="120.0" text-anchor="middle" font-size="15" font-weight="600">Registry</text><text class="t box-t" x="800.0" y="140.0" text-anchor="middle" font-size="15">loads built in actions</text><text class="t box-t" x="800.0" y="160.0" text-anchor="middle" font-size="15">and the user&#x27;s own</text><line class="ln" x1="290.0" y1="135" x2="350.0" y2="135" marker-end="url(#a)"/><line class="ln" x1="610.0" y1="135" x2="670.0" y2="135" marker-end="url(#a)"/><path class="hexhot" d="M800.0,264.0L848.5,292.0L848.5,348.0L800.0,376.0L751.5,348.0L751.5,292.0Z"/><text class="hexhot-t" x="800.0" y="325" text-anchor="middle" font-size="18" font-weight="600">MERGE</text><line class="ln" x1="800.0" y1="210" x2="800.0" y2="262" marker-end="url(#a)"/><text class="t" x="800.0" y="400" text-anchor="middle" font-size="15">a cell in the hive</text><text class="head" x="30.0" y="300" text-anchor="start" font-size="15">Engines in this build</text><rect class="box" x="30.0" y="320" width="280" height="50" rx="12"/><text class="t box-t" x="170.0" y="349.5" text-anchor="middle" font-size="14" font-weight="600">image   in process, pure Rust</text><rect class="box" x="330.0" y="320" width="280" height="50" rx="12"/><text class="t box-t" x="470.0" y="349.5" text-anchor="middle" font-size="14" font-weight="600">pdf   in process, lopdf</text><rect class="box" x="30.0" y="382" width="280" height="50" rx="12"/><text class="t box-t" x="170.0" y="411.5" text-anchor="middle" font-size="14" font-weight="600">ffmpeg   child process</text><rect class="box" x="330.0" y="382" width="280" height="50" rx="12"/><text class="t box-t" x="470.0" y="411.5" text-anchor="middle" font-size="14" font-weight="600">office   child process, LibreOffice</text><rect class="box" x="30.0" y="444" width="280" height="50" rx="12"/><text class="t box-t" x="170.0" y="473.5" text-anchor="middle" font-size="14" font-weight="600">ghostscript   child process</text><text class="t" x="930.0" y="536" text-anchor="end" font-size="14">Never put action logic in the UI.</text></svg>
