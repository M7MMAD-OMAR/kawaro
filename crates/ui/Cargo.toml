[package]
name = "kawaro-ui"
description = "Kawaro interface: the hive and the settings window (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kawaro-core.workspace = true
slint.workspace = true
# Centre cell picture (S-018g): MD5 of the file URI for the thumbnail
# name, PNG text chunks for its validity. Both already in the tree.
md-5 = "0.11"
png = "0.17"
# S-094: the geometry probes the shell tests read (`src/shell.rs`). Off in
# every shipped build; the self dev dependency below turns it on for tests.
i-slint-backend-testing = { version = "=1.18.1", optional = true }

# Wayland drop receiver (S-014b, ADR 0003): a second connection on winit's
# display. Same versions winit already pulls in, so no new packages.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
rustix = { version = "1.1.5", features = ["event", "pipe", "fs"] }
# Layer-shell hive (S-018b, ADR 0004): a thin platform over the winit backend
# that gives the hive its own overlay adapter. Same versions slint and winit
# already pull in, so no new packages.
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
i-slint-core = { version = "=1.18.1", default-features = false }
# "unstable" for xdg-output: the output under `kawaro drop --at` (S-019d).
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
# Screen reader state from org.a11y.Status (S-018 AC12). Same version
# accesskit and the daemon's tray already pull in, so no new packages.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

# The Windows hive window (S-046): cursor, monitors, DPI and the corner
# attribute. Already in Cargo.lock through other crates, so no new package.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[features]
testing-hooks = ["dep:i-slint-backend-testing"]

[build-dependencies]
slint-build.workspace = true
serde_json.workspace = true

[dev-dependencies]
kawaro-ui = { path = ".", features = ["testing-hooks"] }
# Headless Slint platform for the behaviour test; same pinned version as slint.
i-slint-backend-testing = "=1.18.1"
# S-062: tests/contrast.rs reads design/tokens.json (already in the tree).
serde_json.workspace = true
# S-047 AC5: the drop runs a real image action through the existing runner
# and checks the original's SHA-256. All three are already in the tree.
kawaro-engines.workspace = true
sha2.workspace = true
tempfile.workspace = true
