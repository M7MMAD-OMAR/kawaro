[package]
name = "sbarhive-ui"
description = "SbarHive interface: the hive and the settings window (Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbarhive-core.workspace = true
slint.workspace = true

[build-dependencies]
