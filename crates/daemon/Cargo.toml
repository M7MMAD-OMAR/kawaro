[package]
name = "sbarhive-daemon"
description = "SbarHive background service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sbarhived"
path = "src/main.rs"

[dependencies]
# The GlobalShortcuts portal client (S-014e1 AC14): no tokio, the zbus of
# crates/ui.
ashpd = { version = "=0.13.13", default-features = false, features = ["global_shortcuts", "async-io"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.18.2"
sbarhive-core.workspace = true
sbarhive-engines.workspace = true
sbarhive-ui.workspace = true
serde_json.workspace = true
slint.workspace = true

[dev-dependencies]
tempfile.workspace = true
