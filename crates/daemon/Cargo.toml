[package]
name = "kawaro-daemon"
description = "Kawaro background service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kawarod"
path = "src/main.rs"

[dependencies]
notify-rust = "4.18.2"
kawaro-core.workspace = true
kawaro-engines.workspace = true
kawaro-ui.workspace = true
serde_json.workspace = true
slint.workspace = true

# The GlobalShortcuts portal client (S-014e1 AC14, no tokio, the zbus of
# crates/ui). It talks D-Bus, so it is Unix only (S-045).
[target.'cfg(unix)'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["global_shortcuts", "async-io"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

# Redirects stderr to the log file (S-045). Already in Cargo.lock through
# other crates, so no new package.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The Windows exe icon and version resource (S-085 AC1, MIT, docs/engines.md).
# build.rs uses it only when the target is Windows.
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
# S-087 AC4: the sample stays byte for byte unchanged across the one-click
# flow, checked by hash. Already in the tree through kawaro-ui.
sha2.workspace = true
# S-090: the welcome window is built under the testing backend.
i-slint-backend-testing = "=1.18.1"
# S-108: the hive's click and Return hooks for the request cell tests.
kawaro-ui = { path = "../ui", features = ["testing-hooks"] }
