[package]
name = "kawaro-core"
description = "Kawaro core: actions, tasks, engine contract, output naming, job queue and IPC types"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
semver.workspace = true
minisign-verify.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The named pipe transport (S-040b), the known folders and the place
# function (S-041). Already in Cargo.lock through other crates, so no new
# package; features add none.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
] }
