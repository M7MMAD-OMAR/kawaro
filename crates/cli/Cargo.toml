[package]
name = "sbarhive-cli"
description = "SbarHive command line"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sbarhive"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
sbarhive-core.workspace = true
sbarhive-engines.workspace = true
serde_json.workspace = true

# Starting the service detached and the foreground grant (S-042). Already in
# Cargo.lock through other crates, so no new package; features add none.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
