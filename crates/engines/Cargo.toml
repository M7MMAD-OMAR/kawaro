[package]
name = "sbarhive-engines"
description = "SbarHive engines: one adapter per backend behind sbarhive_core::Engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbarhive-core.workspace = true
thiserror.workspace = true
toml.workspace = true
# Image engine. Licenses and reasons in docs/engines.md.
# The `nasm` feature of `image` stays off, so rav1e builds without assembly
# and NASM is not needed.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp", "avif", "rayon"] }
webp = { version = "0.3.1", default-features = false }
pdf-writer = "0.15.0"
miniz_oxide = "0.8"
# office and pdf engines (licenses in docs/engines.md)
lopdf = { version = "0.45", default-features = false }
tempfile.workspace = true
zip = { version = "9", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The job object that holds each engine's process tree on Windows (S-025a).
# Already in Cargo.lock through other crates, so no new package; features
# add none.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
serde_json.workspace = true
# reading the DOCX, XLSX and PPTX archives LibreOffice writes
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
