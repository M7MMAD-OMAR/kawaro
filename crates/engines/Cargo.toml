[package]
name = "sbarhive-engines"
description = "SbarHive engines: one adapter per backend behind sbarhive_core::Engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbarhive-core.workspace = true
thiserror.workspace = true
toml.workspace = true
# office and pdf engines (licenses in docs/engines.md)
lopdf = { version = "0.45", default-features = false }
tempfile.workspace = true
zip = { version = "9", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
# reading the DOCX, XLSX and PPTX archives LibreOffice writes
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
