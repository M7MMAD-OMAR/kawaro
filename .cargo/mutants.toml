# cargo-mutants configuration.
# Code compiled only on other platforms cannot be tested by a Linux run, so
# its mutants would always be reported as missed.
#
# The drop receiver (S-014b) runs only on a live Wayland connection: every
# function in receiver.rs takes or dispatches Wayland objects, and the winit
# hooks below run only inside a winit event loop on a compositor. They are
# covered by tests/drop/kwin.sh and tests/drop/gnome.sh (AC5 to AC7), not by
# unit tests; the main-thread side (on_note, Inner::drag) stays mutated.
#
# The layer-shell adapter and the thin platform over winit (S-018b) send and
# dispatch Wayland requests on a live compositor only; they are covered by
# tests/overlay/kwin.sh, gnome.sh and snapshots.sh, not by unit tests. The
# decisions they use stay mutated in overlay.rs (S-018 manager decision 5).
# The screen reader watch (S-018c) reads a live session bus only; it is
# covered by tests/overlay/kwin.sh a11y. The window path's surface line runs
# only inside a winit event loop (tests/overlay/kwin.sh window, gnome.sh),
# and the build kind helpers answer from the live platform only.
# The Windows named pipe (S-022a seed, S-022b pipe) builds for Windows only;
# its decisions stay mutated in transport.rs and transport/deadline.rs.
# The Windows known folders and place function (S-023) build for Windows
# only; the choices stay mutated in paths.rs and output_impl.rs.
# The Windows service start and foreground grant (S-024) build for Windows
# only; the flags, the retry and the grant stay mutated in spawn.rs.
# The Windows job object for engine process trees (S-025a) builds for Windows
# only; the start sequence, thread filter and exe check stay mutated in
# office/tree.rs.
exclude_globs = [
  "crates/engines/src/office/non_unix.rs",
  "crates/ui/src/receiver.rs",
  "crates/ui/src/layer.rs",
  "crates/ui/src/platform.rs",
  "crates/ui/src/a11y.rs",
  "crates/core/src/transport/windows.rs",
  "crates/core/src/paths/windows.rs",
  "crates/core/src/output_impl/windows.rs",
  "crates/cli/src/spawn/windows.rs",
]
exclude_re = [
  "<impl CustomApplicationHandler for FocusWatcher>::window_event",
  "in attach_receiver$",
  "replace attach_receiver with",
  # The layer path's attach (S-018d) binds on a live layer connection only
  # (tests/overlay/kwin.sh drop, tests/drop/kwin.sh).
  "in attach_layer_receiver$",
  "replace attach_layer_receiver with",
  "in frame_presented$",
  "replace frame_presented with",
  "in token_hook$",
  "replace token_hook -> ",
  # init() picks the platform on a live display only (tests/overlay/*.sh,
  # snapshots.sh); the surface decision it calls stays mutated in overlay.rs.
  "in init$",
  "replace init -> ",
  "in report_surface$",
  "replace report_surface with",
  "in report_window$",
  "replace report_window with",
  "replace wants_layer -> bool",
  "replace built_on_layer -> bool",
  # Diagnostic stderr line for the headless scripts (tests/overlay/preview.sh,
  # tests/e2e/run.sh read it); no unit test can observe stderr here.
  "in debug_preview$",
  "replace debug_preview with",
  # The one write of a diagnostic line those scripts read (S-019 rework):
  # only stderr observes it.
  "replace stderr_line with",
  # Daemon glue that needs the socket, the windows and the event loop
  # together; tests/e2e/run.sh and tests/overlay/*.sh cover it end to end.
  "replace handle with \\(\\)",
  "replace build -> Result",
  "replace present with \\(\\)",
  # The service's accept loop (S-022a) runs only inside the live daemon;
  # tests/e2e/run.sh covers it. The transport it accepts from stays mutated.
  "replace serve with \\(\\)",
  # The settings watcher (S-023 changed its import and its one call to the
  # actions folder) is an endless poll loop that posts a reload to the Slint event loop, so no unit test can
  # run it; its stamp() stays mutated and tests/e2e/run.sh covers reload.
  "replace run with \\(\\)$",
  # A Unix socket has no write buffer: std's flush is already Ok(()), so
  # this mutant is equivalent.
  "replace <impl Write for Stream>::flush -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
  # The long press gate's daemon side (S-019e): it posts to the Slint event
  # loop, ticks a slint::Timer and shows the live hive, so no unit test can
  # run it. The gate itself is pure and mutated in crates/core/src/hold.rs;
  # this glue is covered by tests/drop/kwin.sh level=1 (held, tap,
  # hold-over, lone release, hold_ms), tests/drop/budget.sh 20 1 hold and
  # tests/hyprland/repro.sh --json --quasimode.
  "in hold_signal$",
  "replace hold_signal with",
  "in gate_tick$",
  "replace gate_tick with",
  "replace gate_hive_closed with",
  # The client's service binary lookup (S-024 changed it to pass the exe
  # suffix): its choice is daemon_binary_in, mutated in spawn.rs; this glue
  # only reads current_exe, and tests/e2e/run.sh "open starts the daemon"
  # covers it. exec_daemon on Unix replaces the process with the service,
  # so no test can return from it; S-024 only gated its unchanged body
  # behind cfg(unix), and its Windows twin is wait_exit, mutated in spawn.rs.
  "replace daemon_binary -> PathBuf with",
  "replace exec_daemon -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
]
