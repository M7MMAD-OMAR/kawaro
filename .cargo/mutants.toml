# cargo-mutants configuration.
# Code compiled only on other platforms cannot be tested by a Linux run, so
# its mutants would always be reported as missed.
#
# The drop receiver (S-014b) runs only on a live Wayland connection: every
# function in receiver.rs takes or dispatches Wayland objects, and the winit
# hooks below run only inside a winit event loop on a compositor. They are
# covered by tests/drop/kwin.sh and tests/drop/gnome.sh (AC5 to AC7), not by
# unit tests; the main-thread side (on_note, Inner::drag) stays mutated.
#
# The layer-shell adapter and the thin platform over winit (S-018b) send and
# dispatch Wayland requests on a live compositor only; they are covered by
# tests/overlay/kwin.sh, gnome.sh and snapshots.sh, not by unit tests. The
# decisions they use stay mutated in overlay.rs (S-018 manager decision 5).
# The screen reader watch (S-018c) reads a live session bus only; it is
# covered by tests/overlay/kwin.sh a11y. The window path's surface line runs
# only inside a winit event loop (tests/overlay/kwin.sh window, gnome.sh),
# and the build kind helpers answer from the live platform only.
# The GlobalShortcuts portal client's D-Bus side (S-014e1) runs on a live
# session bus only, on its own thread and connection; it is covered by
# tests/drop/portal.sh. Its decisions stay mutated in
# crates/daemon/src/portal.rs (S-014e decision 5).
# The Windows named pipe (S-040a seed, S-040b pipe) builds for Windows only;
# its decisions stay mutated in transport.rs and transport/deadline.rs.
# The Windows known folders and place function (S-041) build for Windows
# only; the choices stay mutated in paths.rs and output_impl.rs.
# The Windows service start and foreground grant (S-042) build for Windows
# only; the flags, the retry and the grant stay mutated in spawn.rs.
# The Windows executable check (S-043a) builds for Windows only; the exe
# check stays mutated in office/tree.rs.
# The Windows job object for engine process trees (S-030 moved it from
# office/non_unix.rs) builds for Windows only; the start sequence and thread
# filter stay mutated in office/tree.rs.
# The Windows registry reader (S-043b) builds for Windows only; the lookup
# order that reads it stays mutated in locate.rs.
# The UTF-16 helpers (S-029 AC1) build for Windows only; the files above
# that call them are left out too.
# The Windows stderr redirect (S-045) and the Windows tray stub (S-045, real
# icon in S-046) build for Windows only; the live check is S-052. The log
# file opener stays mutated in crates/daemon/src/logfile.rs.
# The Windows hive window and the shell glue (S-046) build for Windows only;
# the live check is S-052. Their decisions stay mutated in monitor.rs,
# merge.rs, args.rs, batch.rs and server.rs (focus_log).
# The Windows shell thread (S-048): the hidden window, the tray icon, the
# shortcut and the popup menu build for Windows only; the live check is
# S-052. Their decisions stay mutated in shell_logic.rs and core/hotkey.rs.
# The reg.exe runner (S-050) builds for Windows only; the live check is
# S-052. The command lines and the dry run stay mutated in registry.rs and
# integration.rs.
# The Windows update helper (S-054a): it copies and starts kawaro.exe, waits
# for the daemon on the pipe and runs msiexec; the live check is S-052. Its
# order, command line and exit codes stay mutated in update/apply.rs.
# The update daemon's system side (S-054b): the real state, the saved
# schedule, the installer call and the daemon restart in update_sys.rs, and
# the thread glue (start, run) in update.rs; the live check is S-052 and
# tests/e2e/run.sh. The rules (tick, check_now, request_apply, tick_due,
# apply_waiting) stay mutated in update.rs.
# The CLI update command's system side (S-054c): it probes /usr/bin and the
# /etc repository folders, finds the system curl and runs pkexec; the live
# check is S-052 and tests/s054c_update_bin.rs runs it for --status. The
# command itself stays mutated in crates/cli/src/update.rs.
# The Explorer drop glue (S-047): the cursor poll timer, GetCursorPos and the
# winit drag events build for Windows only; the live check is S-052. The
# tracker and the S-021 rule stay mutated in drop_track.rs.
exclude_globs = [
  "crates/ui/src/dnd/windows.rs",
  "crates/daemon/src/update_sys.rs",
  "crates/cli/src/update_sys.rs",
  "crates/cli/src/integration/windows.rs",
  "crates/ui/src/win_window.rs",
  "crates/daemon/src/shell_open.rs",
  "crates/daemon/src/shell.rs",
  "crates/engines/src/office/non_unix.rs",
  "crates/engines/src/process/windows.rs",
  "crates/engines/src/locate/windows.rs",
  "crates/ui/src/receiver.rs",
  "crates/ui/src/layer.rs",
  "crates/ui/src/platform.rs",
  "crates/ui/src/a11y.rs",
  "crates/daemon/src/portal_bus.rs",
  "crates/core/src/transport/windows.rs",
  "crates/core/src/paths/windows.rs",
  "crates/core/src/output_impl/windows.rs",
  "crates/cli/src/spawn/windows.rs",
  "crates/core/src/win.rs",
  "crates/core/src/update/apply/windows.rs",
  "crates/daemon/src/logfile/windows.rs",
  "crates/daemon/src/tray/windows.rs",
  # S-045 moved tray.rs here unchanged (a pure rename); it was never
  # mutation-tested, the live tray is covered by tests/e2e/run.sh.
  "crates/daemon/src/tray/linux.rs",
]
exclude_re = [
  # The privileged step's trust check (S-067, now in core's SystemRunner): a
  # mutant that makes pkexec_target miss the privileged step, or drops the
  # refusal in SystemRunner::run, would start the real /usr/bin/pkexec from
  # the refusal test, and no test may run pkexec. The shape is pinned by the
  # pure pkexec_target test and the refusal by the unmutated SystemRunner
  # tests; the mutants that cannot reach pkexec stay mutated.
  "crates/core/src/update/apply.rs:.*replace pkexec_target -> Option<&Path> with None",
  "crates/core/src/update/apply.rs:.*replace == with != in pkexec_target$",
  "crates/core/src/update/apply.rs:.*replace match guard .* with false in pkexec_target$",
  "crates/core/src/update/apply.rs:.*delete ! in <impl CommandRunner for SystemRunner>::run$",
  # The one open folder spawn (S-067): it starts xdg-open or Explorer on the
  # live desktop, which no test may reach; the command it is given is the
  # pure open_folder_command, mutated in notify_logic.rs.
  "crates/daemon/src/notify.rs:.*replace open_folder with \\(\\)",
  # The production notification wrappers (S-054b) talk to the desktop, which
  # no test may reach (KAWARO_NO_NOTIFY); their rules stay mutated in
  # notify_update_with and report_update_result_with.
  "crates/daemon/src/notify.rs:.*replace <impl UpdateSink for Desktop>::",
  # The gate in front of notify-rust (S-054b rework 1): the rule is the pure
  # notifications_allowed; show and finished only call the service.
  "crates/daemon/src/notify.rs:.*replace show -> ",
  "crates/daemon/src/notify.rs:.*in show$",
  "crates/daemon/src/notify.rs:.*replace send -> ",
  "crates/daemon/src/notify.rs:.*replace finished with",
  "crates/daemon/src/notify.rs:.*replace (notify_update|report_update_result) with",
  # The notification builder (S-049) and the Open folder click in finished
  # reach only the desktop, which a test build never calls; the command they
  # spawn is the pure open_folder_command, mutated in notify_logic.rs. The
  # Windows app id line is covered by scripts/windows/check.sh and S-052.
  "crates/daemon/src/notify.rs:.*replace notification -> Notification with",
  "crates/daemon/src/notify.rs:.*replace == with != in finished$",
  # The accessor of the one static holder (S-054b rework 1); the holder itself
  # is mutated through its own methods.
  "crates/daemon/src/progress.rs:.*replace shared -> ",
  "crates/daemon/src/update.rs:.*replace start with \\(\\)",
  "crates/daemon/src/update.rs:.*replace run with \\(\\)",
  # Windows-only window handle (S-046); the live check is S-052.
  "replace Hive::hwnd -> Option<isize> with",
  # The Windows-only log redirect wiring (S-045); the live check is S-052.
  "crates/daemon/src/main.rs:.*replace log_to_file with",
  "<impl CustomApplicationHandler for FocusWatcher>::window_event",
  "in attach_receiver$",
  "replace attach_receiver with",
  # The layer path's attach (S-018d) binds on a live layer connection only
  # (tests/overlay/kwin.sh drop, tests/drop/kwin.sh).
  "in attach_layer_receiver$",
  "replace attach_layer_receiver with",
  "in frame_presented$",
  "replace frame_presented with",
  "in token_hook$",
  "replace token_hook -> ",
  # init() picks the platform on a live display only (tests/overlay/*.sh,
  # snapshots.sh); the surface decision it calls stays mutated in overlay.rs.
  "in init$",
  "replace init -> ",
  "in report_surface$",
  "replace report_surface with",
  "in report_window$",
  "replace report_window with",
  "replace wants_layer -> bool",
  "replace built_on_layer -> bool",
  # Diagnostic stderr line for the headless scripts (tests/overlay/preview.sh,
  # tests/e2e/run.sh read it); no unit test can observe stderr here.
  "in debug_preview$",
  "replace debug_preview with",
  # The one write of a diagnostic line those scripts read (S-019 rework):
  # only stderr observes it.
  "replace stderr_line with",
  # Daemon glue that needs the socket, the windows and the event loop
  # together; tests/e2e/run.sh and tests/overlay/*.sh cover it end to end.
  "replace handle with \\(\\)",
  "replace build -> Result",
  "replace present with \\(\\)",
  # The service's accept loop (S-040a) runs only inside the live daemon;
  # tests/e2e/run.sh covers it. The transport it accepts from stays mutated.
  "replace serve with \\(\\)",
  # The settings watcher (S-041 changed its import and its one call to the
  # actions folder) is an endless poll loop that posts a reload to the Slint event loop, so no unit test can
  # run it; its stamp() stays mutated and tests/e2e/run.sh covers reload.
  "replace run with \\(\\)$",
  # A Unix socket has no write buffer: std's flush is already Ok(()), so
  # this mutant is equivalent.
  "replace <impl Write for Stream>::flush -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)",
  # The long press gate's daemon side (S-019e): it posts to the Slint event
  # loop, ticks a slint::Timer and shows the live hive, so no unit test can
  # run it. The gate itself is pure and mutated in crates/core/src/hold.rs;
  # this glue is covered by tests/drop/kwin.sh level=1 (held, tap,
  # hold-over, lone release, hold_ms), tests/drop/budget.sh 20 1 hold,
  # tests/hyprland/repro.sh --json --quasimode, and for the portal token
  # (S-014f3) tests/drop/portal.sh ac15 and tests/drop/gnome.sh ... portal.
  # The token rule itself is mutated in crates/daemon/src/portal.rs.
  "in hold_signal$",
  "replace hold_signal with",
  "in gate_tick$",
  "replace gate_tick with",
  "replace gate_hive_closed with",
  # The daemon's main() wires it together on a live display and socket; the
  # portal client it starts (S-014e1) is covered by tests/drop/portal.sh.
  # Anchored to the daemon file: the CLI's main stays mutated.
  "crates/daemon/src/main.rs:.*replace main -> ExitCode with",
  # The daemon's reload (S-014f2) re-reads config.toml from $HOME and
  # rebuilds the windows and the portal client on the event loop; its
  # portal decision stays mutated in crates/daemon/src/portal.rs, and the
  # glue is covered by tests/drop/portal.sh live. Anchored to the daemon.
  "crates/daemon/src/ui.rs:.*replace reload with \\(\\)",
  # Its comparisons of the values before and after (S-029 AC8) reach only
  # the tray, the windows and the portal client on a live session; covered
  # by tests/drop/portal.sh and tests/e2e/run.sh.
  "crates/daemon/src/ui.rs:.*in reload$",
  # The client's service binary lookup (S-042 changed it to pass the exe
  # suffix): its choice is daemon_binary_in, mutated in spawn.rs; this glue
  # only reads current_exe, and tests/e2e/run.sh "open starts the daemon"
  # covers it. exec_daemon on Unix replaces the process with the service,
  # so no test can return from it; S-042 only gated its unchanged body
  # behind cfg(unix), and its Windows twin is wait_exit, mutated in spawn.rs.
  "replace daemon_binary -> PathBuf with",
  "replace exec_daemon -> Result<\\(\\), String> with Ok\\(\\(\\)\\)",
  # The engine program lookup (S-043b): find only reads the live PATH,
  # environment, current_exe and registry; its choice is search, mutated in
  # locate.rs. The Office and Ghostscript tests skip when the program is
  # absent, and ffmpeg keeps its bare name, which the OS resolves the same
  # way, so its None mutant is not observable. The empty registry off
  # Windows is never asked there (search stops after PATH on Unix).
  "replace find -> Option<PathBuf> with None",
  "replace <impl Registry for SystemRegistry>::value -> Option<String> with",
  "replace <impl Registry for SystemRegistry>::subkeys -> Vec<String> with",
]
