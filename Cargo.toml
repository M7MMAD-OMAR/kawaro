[workspace]
resolver = "3"
members = ["crates/core", "crates/engines", "crates/ui", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.4.0-beta.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/M7MMAD-OMAR/sbarhive"
rust-version = "1.85"

[workspace.dependencies]
sbarhive-core = { path = "crates/core" }
sbarhive-engines = { path = "crates/engines" }
sbarhive-ui = { path = "crates/ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
semver = "1"
minisign-verify = "0.3"
sha2 = "0.11"
tempfile = "3"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2", "unstable-winit-030"] }
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Transparent windows on Wayland with the software renderer; see
# vendor/softbuffer/SBARHIVE-PATCH.md.
[patch.crates-io]
softbuffer = { path = "vendor/softbuffer" }
